<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunAlgorithms – Auction Platform</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Socket.IO Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
    <!-- FingerprintJS2 (for device ban) -->
    <script src="https://cdn.jsdelivr.net/npm/fingerprintjs2@2.1.4/dist/fingerprint2.min.js"></script>
    <!-- Chart.js (for analytics) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SimplePeer (for WebRTC) -->
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ========================================= -->
    <!-- APP CONTAINER                             -->
    <!-- ========================================= -->
    <div id="app">
        <!-- NAVIGATION BAR -->
        <nav id="navbar" style="display:none;">
            <div class="nav-left">
                <h1 onclick="navigate('sellerFeed')" style="cursor:pointer;color:var(--green);">
                    <i class="fas fa-gavel"></i> SunAlgorithms
                </h1>
            </div>
            <div class="nav-center" id="navLinks">
                <span onclick="navigate('sellerFeed')">Sellers</span>
                <span onclick="openCreateAuction()" id="createAuctionBtn" style="display:none;">+ Create</span>
                <span onclick="navigate('profile')" id="profileBtn">Profile</span>
                <span onclick="navigate('sellerDashboard')" id="sellerDashBtn" style="display:none;">Dashboard</span>
                <span onclick="navigate('adminDashboard')" id="adminDashBtn" style="display:none;">Admin</span>
            </div>
            <div class="nav-right">
                <span id="userDisplay"></span>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </nav>

        <!-- MAIN CONTENT AREA -->
        <main id="mainContent">
            <!-- Pages will be rendered here by app.js -->
        </main>
    </div>

    <!-- ========================================= -->
    <!-- MODAL (Reusable)                         -->
    <!-- ========================================= -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContent">
            <!-- Dynamic content injected here -->
        </div>
    </div>

    <!-- ========================================= -->
    <!-- TOAST NOTIFICATION                        -->
    <!-- ========================================= -->
    <div id="toast" style="display:none;position:fixed;bottom:20px;right:20px;padding:16px 24px;border-radius:12px;background:rgba(0,0,0,0.9);border:1px solid var(--green);color:#fff;z-index:9999;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.6);">
    </div>

    <!-- ========================================= -->
    <!-- JAVASCRIPT (app.js)                      -->
    <!-- ========================================= -->
    <script src="app.js"></script>
</body>
</html>
