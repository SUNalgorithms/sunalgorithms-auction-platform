<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM - Central Market | Automotive Auctions</title>

    <!-- Favicon / Logo -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg">
    <link rel="apple-touch-icon" href="/logo.jpeg">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>

    <!-- FingerprintJS2 -->
    <script src="https://cdn.jsdelivr.net/npm/fingerprintjs2@2.1.4/dist/fingerprint2.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SimplePeer (WebRTC) -->
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
</head>
<body>

    <!-- ===== CM LOADER (reveal animation) ===== -->
    <div id="cm-loader" style="position:fixed; inset:0; background:#F5F5F7; z-index:99999; display:flex; align-items:center; justify-content:center; flex-direction:column; transition:opacity 0.6s ease;">
        <img src="/logo.jpeg" style="width:96px; height:96px; object-fit:contain; border-radius:18px; animation: cmPulse 1.2s infinite;">
        <div style="margin-top:18px; display:flex; gap:8px; align-items:baseline;">
            <span style="font-weight:900; font-size:32px; letter-spacing:-1px; color:#101010;">CM</span>
            <span style="font-weight:800; letter-spacing:3px; font-size:13px; color:#101010;">CENTRAL MARKET</span>
        </div>
        <div style="margin-top:6px; font-weight:700; font-size:9px; letter-spacing:4px; color:#E30613;">AUTOMOTIVE AUCTIONS</div>
    </div>
    <style>@keyframes cmPulse{0%,100%{transform:scale(1)}50%{transform:scale(0.92)}}</style>

    <!-- ===== SINGLE NAVBAR – NO DUPLICATES ===== -->
    <nav id="navbar" style="display:none; background:white; border-bottom:1px solid #EAEAEA; position:sticky; top:0; z-index:100; height:68px; padding:0 1.2rem; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">

        <!-- Logo (click → marketplace) -->
        <div style="display:flex; gap:0.6rem; align-items:center; cursor:pointer;" onclick="navigate('marketplace')">
            <img src="/logo.jpeg" alt="CM" style="width:38px; height:38px; border-radius:8px; object-fit:contain;">
            <div style="line-height:1;">
                <div style="display:flex; align-items:baseline; gap:4px;">
                    <span style="font-weight:900; font-size:18px; color:#101010; letter-spacing:-0.5px;">CM</span>
                    <span style="font-weight:800; font-size:11px; color:#101010; letter-spacing:1.5px;">CENTRAL MARKET</span>
                </div>
                <div style="font-weight:700; font-size:7.5px; color:#E30613; letter-spacing:3px; margin-top:2px;">AUTOMOTIVE AUCTIONS</div>
            </div>
        </div>

        <!-- Nav links + auth buttons -->
        <div style="display:flex; gap:0.9rem; align-items:center; flex-wrap:wrap;">
            <span onclick="navigate('marketplace')" style="cursor:pointer; font-weight:700; font-size:0.9rem; color:#101010;">Marketplace</span>

            <span onclick="navigate('dashboard')" id="dashboardBtn" style="display:none; cursor:pointer; font-weight:700; font-size:0.9rem; color:#101010;">Dashboard</span>

            <span onclick="navigate('createListing')" id="createListingBtn" style="display:none; background:#E30613; color:white; padding:0.5rem 1rem; border-radius:8px; font-weight:800; cursor:pointer; font-size:0.85rem;">+ Sell</span>

            <span onclick="navigate('profile')" id="profileBtn" style="display:none; cursor:pointer; font-weight:700; font-size:0.9rem; color:#101010;">Profile</span>

            <span onclick="navigate('adminDashboard')" id="adminDashBtn" style="display:none; cursor:pointer; font-weight:700; font-size:0.9rem; color:#E30613;">Admin</span>

            <span id="userDisplay" style="font-weight:700; font-size:0.85rem; color:#666;"></span>

            <!-- GUEST ONLY: Login + Register -->
            <button id="loginNavBtn" onclick="showLogin()" style="border:1px solid #E30613; color:#E30613; background:white; border-radius:8px; padding:6px 12px; font-weight:800; cursor:pointer; font-size:0.8rem; display:none;">Login</button>
            <button id="registerNavBtn" onclick="showRegister()" style="background:#E30613; color:white; border:none; border-radius:8px; padding:6px 12px; font-weight:800; cursor:pointer; font-size:0.8rem; display:none;">Register</button>

            <!-- LOGGED-IN ONLY: Logout -->
            <button id="logoutNavBtn" onclick="logout()" style="border:1px solid #EAEAEA; color:#666; background:white; border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:0.8rem; display:none;">Logout</button>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="mainContent" class="content" style="padding:1.5rem; max-width:1400px; margin:0 auto;"></main>

    <!-- ===== TOAST ===== -->
    <div id="toast" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#101010; color:white; padding:0.8rem 1.5rem; border-radius:9999px; font-weight:600; z-index:9999; max-width:90%;"></div>

    <!-- ===== MODAL ===== -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- ===== APP SCRIPT ===== -->
    <script src="/app.js"></script>

    <!-- ===== AUTO-HIDE LOADER AFTER APP LOADS ===== -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const l = document.getElementById('cm-loader');
                if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 700); }
            }, 900);
        });
    </script>
</body>
</html>
